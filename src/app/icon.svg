<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Favicon: the site's padlock mascot, simplified for 16px.
    Colours are literal rather than CSS variables because a favicon renders
    outside the page and gets no access to the document's custom properties.
    The face is trimmed to two eyes and a smile; blush and keyhole disappear
    at tab size and only muddy the shape.
  -->
  <rect width="64" height="64" rx="14" fill="#2b1220" />
  <path
    d="M22 30v-7a10 10 0 0 1 20 0v7"
    fill="none"
    stroke="#ff8fbf"
    stroke-width="6"
    stroke-linecap="round"
  />
  <rect x="13" y="29" width="38" height="26" rx="8" fill="#ff8fbf" />
  <circle cx="25" cy="40" r="2.8" fill="#2b1220" />
  <circle cx="39" cy="40" r="2.8" fill="#2b1220" />
  <path
    d="M28 46.5q4 3.4 8 0"
    fill="none"
    stroke="#2b1220"
    stroke-width="2.4"
    stroke-linecap="round"
  />
</svg>
